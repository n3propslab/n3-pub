name: secret-scope-probe
on: workflow_dispatch
jobs:
  noenv:
    runs-on: ubuntu-latest
    steps:
      - env:
          R: ${{ secrets.REPO_SECRET_1792137 }}
          E: ${{ secrets.ENV_SECRET_1792137 }}
          D: ${{ secrets.DEP_SECRET_1792137 }}
        run: |
          [ -n "$R" ] && echo NOENV_REPO_PRESENT || echo NOENV_REPO_ABSENT
          [ -n "$E" ] && echo NOENV_ENV_PRESENT || echo NOENV_ENV_ABSENT
          [ -n "$D" ] && echo NOENV_DEP_PRESENT || echo NOENV_DEP_ABSENT
  withenv:
    runs-on: ubuntu-latest
    environment: prod-1792137
    steps:
      - env:
          R: ${{ secrets.REPO_SECRET_1792137 }}
          E: ${{ secrets.ENV_SECRET_1792137 }}
        run: |
          [ -n "$R" ] && echo WITHENV_REPO_PRESENT || echo WITHENV_REPO_ABSENT
          [ -n "$E" ] && echo WITHENV_ENV_PRESENT || echo WITHENV_ENV_ABSENT
