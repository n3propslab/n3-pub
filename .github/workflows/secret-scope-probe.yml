name: secret-scope-probe
on: workflow_dispatch
jobs:
  noenv:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "REPO=${{ secrets.REPO_SECRET_1792137 != '' && 'yes' || 'no' }}"
          echo "ENV_noenv=${{ secrets.ENV_SECRET_1792137 != '' && 'yes' || 'no' }}"
          echo "DEP=${{ secrets.DEP_SECRET_1792137 != '' && 'yes' || 'no' }}"
  withenv:
    runs-on: ubuntu-latest
    environment: prod-1792137
    steps:
      - run: |
          echo "ENV_withenv=${{ secrets.ENV_SECRET_1792137 != '' && 'yes' || 'no' }}"
          echo "REPO_withenv=${{ secrets.REPO_SECRET_1792137 != '' && 'yes' || 'no' }}"
